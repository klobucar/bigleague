# Generated by `minimal init`

[upstream] # Source of software & tooling
repo = "https://github.com/gominimal/pkgs"
branch = "main"
locked_commit = "b1dbc13914994200ec1b93e9644cfb0829c7f275"

[harness]
use = "uv"
build_packages = ["gcc"]

[defaults]
state_key = "dev"

[tasks.shell]
interactive = true
packages = ["base"]
exec = "bash --noprofile -l"

[tasks.claude]
interactive = true
packages = ["base", "bash","git", "uv", "claude-code", "curl"]
exec = "claude --dangerously-skip-permissions"
runtime_packages = ["python"]
patches.dir."~/src/harry-bot" = "read-only"
patches.dir."~/src/bouquet" = "read-only"
