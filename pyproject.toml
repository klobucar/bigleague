[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Only the bigleague package ships; bench/ and tests/ are dev-only and would
# otherwise trip setuptools' flat-layout auto-discovery when bigleague is
# installed as a path dependency.
[tool.setuptools]
packages = ["bigleague"]

# PEP 561 marker: the package is annotated, so type checkers should use it.
[tool.setuptools.package-data]
bigleague = ["py.typed"]

[project]
name = "bigleague"
version = "0.1.0"
description = "Async polars-native baseball data and plotting library"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jonathon Klobucar" }]
keywords = [
    "baseball",
    "mlb",
    "statcast",
    "fangraphs",
    "sabermetrics",
    "polars",
    "matplotlib",
    "asyncio",
]
# No `License ::` classifier: it is superseded by the SPDX `license`
# expression above, and setuptools rejects both together.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "polars>=0.20",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/klobucar/bigleague"
Repository = "https://github.com/klobucar/bigleague"
Issues = "https://github.com/klobucar/bigleague/issues"
Changelog = "https://github.com/klobucar/bigleague/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Optional runtime accelerator: gates negative cache lookups behind a
# bloom filter. The library degrades gracefully without it (see cache.py).
# Distribution name is `bouquet-bloom`; the import name is `bouquet`.
bloom = ["bouquet-bloom>=0.1.0"]
# `dev` deliberately omits bouquet — it's an optional accelerator, not a
# dev requirement, and the suite skips bloom-only tests when it's absent.
# To exercise the bloom path locally: `uv sync --extra dev --extra bloom`.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-recording>=0.13",
    "respx>=0.21",
    "vcrpy>=6",
    "ruff>=0.7",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:vcr",
]

[tool.uv]
package = false
# Supply-chain defense: only install package versions published at least
# 1 week ago so freshly-uploaded malicious releases have time to be caught.
exclude-newer = "1 week"
# Reviewed exception for our own package: bouquet-bloom 0.1.1 was published
# 2026-11-22, inside the cooldown window. Remove this line once it is a week
# old (after 2026-11-29); the global cooldown then covers it.
exclude-newer-package = { bouquet-bloom = "2026-11-23T00:00:00Z" }

# ── ruff ───────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["bigleague", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PTH",   # flake8-use-pathlib
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "PERF",  # perflint
    "FA",    # flake8-future-annotations
    "G",     # flake8-logging-format
]
ignore = [
    "E501",    # line length — handled by formatter
    "SIM108",  # ternary vs if/else — subjective
    "PLC0415", # local imports — needed for lazy matplotlib import in plots
    "PLW0603", # global statement — used by http.py client cache
    "PT011",   # broad pytest.raises — fine for our error checks
    "RET504",  # unnecessary assignment before return — readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── ty ─────────────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.12"
